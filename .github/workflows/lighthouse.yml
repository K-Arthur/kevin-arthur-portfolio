name: Lighthouse CI

# Performance / accessibility / best-practices / SEO quality gate.
#
# This runs the Lighthouse CI audit against the production server and enforces a
# curated set of assertions. It is intentionally SEPARATE from the primary
# correctness gate (see ci.yml) so that a noisy performance "opportunity" audit
# can never mask a real build/lint/type failure, and vice-versa.
#
# History: this workflow was red on every run for ~6 months. The root cause was
# the `lighthouse:no-pwa` preset, which marks EVERY Lighthouse audit as an
# error-level assertion. That made the pipeline fail continuously and therefore
# uselessly. We now use an explicit, curated assertion set (see lighthouserc.js)
# so the check is meaningful and stable.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Read-only by default; only the optional PR-comment step needs pull-request write.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run Lighthouse CI
        # `@lhci/cli` is a devDependency, so the local binary is on PATH via npx
        # (no global install, no network round-trip, no version drift).
        run: npx --no-install lhci autorun

      - name: Write Lighthouse summary
        if: always()
        run: node scripts/lhci-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
            !.lighthouseci/*.db
          retention-days: 30

      - name: Comment PR with results
        # Only comment on PRs from this repository (fork PRs have no write
        # permission to the base repo, so the call would fail with 403).
        # continue-on-error keeps a comment failure from failing the audit.
        uses: actions/github-script@v7
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          always()
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const lhciDir = '.lighthouseci';
            if (!fs.existsSync(lhciDir)) {
              console.log('No Lighthouse results found');
              return;
            }

            const reportFiles = fs
              .readdirSync(lhciDir)
              .filter((f) => f.endsWith('.json') && f !== 'assertion-results.json')
              .map((f) => path.join(lhciDir, f))
              .map((p) => {
                try {
                  return JSON.parse(fs.readFileSync(p, 'utf8'));
                } catch {
                  return null;
                }
              })
              .filter((r) => r && r.categories && r.finalUrl);

            if (reportFiles.length === 0) {
              console.log('No Lighthouse JSON reports found');
              return;
            }

            const scorePct = (s) => (typeof s === 'number' ? Math.round(s * 100) : 'n/a');
            const emoji = (p) => (p === 'n/a' ? '⚪' : p >= 90 ? '🟢' : p >= 50 ? '🟡' : '🔴');

            let body = '## ⚡ Lighthouse CI Results\n\n';
            for (const report of reportFiles) {
              body += `**${report.finalUrl}**\n\n`;
              body += '| Category | Score |\n|----------|-------|\n';
              for (const key of Object.keys(report.categories)) {
                const c = report.categories[key];
                const pct = scorePct(c.score);
                body += `| ${c.title} | ${emoji(pct)} ${pct} |\n`;
              }
              body += '\n';
            }
            body += '\n*Report generated by [Lighthouse CI](https://github.com/GoogleChrome/lighthouse-ci). Full reports are attached as a workflow artifact.*';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
