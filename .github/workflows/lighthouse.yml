name: Lighthouse CI

# Performance / accessibility / best-practices / SEO quality gate.
# Separate from the primary correctness gate (ci.yml).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run Lighthouse CI
        run: npx --no-install lhci autorun

      - name: Write Lighthouse summary
        if: always()
        run: node scripts/lhci-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          include-hidden-files: true
          path: |
            .lighthouseci/
            !.lighthouseci/*.db
          retention-days: 30

      - name: Comment PR with median scores
        uses: actions/github-script@v7
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          always()
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const MARKER = '<!-- lighthouse-ci-medians -->';
            let body;
            try {
              body = execSync('node scripts/lhci-pr-comment.js', { encoding: 'utf8' });
            } catch (err) {
              console.log(err.message);
              return;
            }
            if (!body || !body.includes(MARKER)) {
              body = `${MARKER}\nNo Lighthouse results found.`;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
